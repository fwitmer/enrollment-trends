{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enrollment trends</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>

  <body>
    <div id="header" style="position: top;"></div>
    <!--Title and navigation buttons-->
    <h1>CS&E Enrollment Trend Dashboard</h1>
  <p>
      <a href="{% if URL_PREFIX %}/{{ URL_PREFIX }}/data/{% else %}/data/{% endif %}">
          <button>UAA Data</button>
      </a>

      <a href="{% if URL_PREFIX %}/{{ URL_PREFIX }}/graduates/{% else %}/graduates/{% endif %}">
          <button>ASD Data</button>
      </a>

      <a href="{% if URL_PREFIX %}/{{ URL_PREFIX }}/model_info/{% else %}/model_info/{% endif %}">
          <button>Model Information</button>
      </a>

      <span style="margin-left: 20px; display: inline-flex; align-items: center; gap: 8px;">
        <label for="predict_mode_select" style="font-weight: bold; font-size: 15px; color: #333;">Predict Semester:</label>
        <select id="predict_mode_select" style="margin-top: 0; padding: 6px 12px; font-size: 15px; border-radius: 4px; border: 1px solid #ccc; background-color: #fff; cursor: pointer;">
          <option value="future" selected>Future semester offered</option>
          <option value="current">Current/most recent semester offered</option>
          <option value="prior">Prior semester offered</option>
        </select>
      </span>
  </p>


    <!--Dropdown menu for course form selection-->
    <form>
      {% csrf_token %}
      <select id="dropdown" name="selected_course">
        <option value="" disabled selected>Select a course</option>
        {% for course in courses %}
          <option value="{{ course }}">{{ course }}</option>
        {% endfor %}
      </select>
    </form>

    <!--Chart container (empty div)-->
    <div id="enrollmentChart" style="position: relative;"></div>

    <!--Stores course data from Django as a json object, use safe so json isnt converted into unreadable html-->
    <script id="course-data" type="application/json">
      {{ course_data|safe }}
    </script>

    <!--Converts the json into javascript objects for chart to use-->
    <script>
  const courseDataRaw = JSON.parse(
    document.getElementById("course-data").textContent
  );

  const isStructured = Boolean(courseDataRaw && courseDataRaw.predictions && courseDataRaw.historical);
  const historicalList = isStructured ? courseDataRaw.historical : (Array.isArray(courseDataRaw) ? courseDataRaw : []);
  const predictionsMap = isStructured ? courseDataRaw.predictions : {};

  // Index historical data by course code
  const historicalByCourse = {};
  for (const entry of historicalList) {
    const code = entry.code;
    if (!historicalByCourse[code]) {
      historicalByCourse[code] = {
        title: entry.title || code,
        terms: [],
        x: [],
        y: []
      };
    }
    if (entry.enrolled !== null && entry.enrolled !== undefined) {
      historicalByCourse[code].terms.push(Number(entry.term));
      historicalByCourse[code].x.push(entry.term_name);
      historicalByCourse[code].y.push(entry.enrolled);
    }
  }

  const dropdown = document.getElementById("dropdown");
  const predictModeSelect = document.getElementById("predict_mode_select");
  const chartDiv = document.getElementById("enrollmentChart");
  const header = document.createElement("header");
  const img = document.createElement("img");
  img.src = "https://www.uaa.alaska.edu/_template/assets/img/uaa_logo.svg";
  header.appendChild(img);
  document.getElementById("header").appendChild(header);

  function updatePredictModeLabels(courseCode) {
    if (!isStructured || !predictionsMap[courseCode] || !predictModeSelect) return;
    const predInfo = predictionsMap[courseCode];
    const targets = predInfo.targets || {};

    const optFuture = predictModeSelect.querySelector('option[value="future"]');
    const optCurrent = predictModeSelect.querySelector('option[value="current"]');
    const optPrior = predictModeSelect.querySelector('option[value="prior"]');

    if (optFuture && targets.future) {
      optFuture.textContent = `Future semester offered (${targets.future.term_name})`;
    }
    if (optCurrent && targets.current) {
      optCurrent.textContent = `Current/most recent semester offered (${targets.current.term_name})`;
    }
    if (optPrior && targets.prior) {
      optPrior.textContent = `Prior semester offered (${targets.prior.term_name})`;
    }
  }

  function renderChart() {
    const selected = dropdown.value;
    const histData = historicalByCourse[selected];
    if (!histData) {
      Plotly.purge(chartDiv);
      return;
    }

    updatePredictModeLabels(selected);

    const selectedMode = predictModeSelect ? (predictModeSelect.value || "future") : "future";
    let predTarget = null;
    let isYearly = false;

    if (isStructured && predictionsMap[selected]) {
      const predInfo = predictionsMap[selected];
      isYearly = predInfo.yearly_course;
      predTarget = predInfo.targets ? predInfo.targets[selectedMode] : null;
    }

    const targetTerm = predTarget ? predTarget.term : null;
    const targetTermName = predTarget ? predTarget.term_name : null;

    let pastX = [];
    let pastY = [];

    if (targetTerm) {
      for (let i = 0; i < histData.terms.length; i++) {
        if (histData.terms[i] < targetTerm) {
          pastX.push(histData.x[i]);
          pastY.push(histData.y[i]);
        }
      }
    } else {
      pastX = [...histData.x];
      pastY = [...histData.y];
    }

    if (pastX.length === 0) {
      pastX = [...histData.x];
      pastY = [...histData.y];
    }

    const lastTerm = pastX[pastX.length - 1];
    const lastY = pastY[pastY.length - 1];

    const hasForecast = predTarget && (
      predTarget.arima_forecast !== null ||
      predTarget.sarima_forecast !== null ||
      predTarget.arimax_forecast !== null ||
      predTarget.sarimax_forecast !== null
    );

    const nextTerm = hasForecast ? targetTermName : (targetTermName ? `${targetTermName} (Insufficient Data)` : "Insufficient Data");

    // Historical data trace
    const tracePast = {
      type: "scatter",
      mode: "lines+markers",
      name: "Historical Data",
      hoverinfo: "x+y",
      x: pastX,
      y: pastY,
      line: { width: 3, color: "#007bff" },
      marker: { size: 8 }
    };

    let maes = [];
    if (predTarget) {
      maes = [predTarget.arima_mae, predTarget.arimax_mae];
      if (!isYearly) {
        maes.push(predTarget.sarima_mae, predTarget.sarimax_mae);
      }
      maes = maes.filter(v => v !== null && !isNaN(v));
    }
    const minMae = maes.length ? Math.min(...maes) : null;

    let bestModel = null;
    if (minMae !== null && predTarget) {
      if (predTarget.arima_mae === minMae) bestModel = "arima";
      else if (predTarget.sarima_mae === minMae) bestModel = "sarima";
      else if (predTarget.arimax_mae === minMae) bestModel = "arimax";
      else if (predTarget.sarimax_mae === minMae) bestModel = "sarimax";
    }

    // ARIMA forecast
    const arimaForecast = predTarget ? predTarget.arima_forecast : null;
    const arimaMae = predTarget ? predTarget.arima_mae : null;
    const traceArima = {
      type: "scatter",
      mode: "lines+markers+text",
      name: `ARIMA Forecast (MAE: ${arimaMae != null ? arimaMae.toFixed(1) : "N/A"})`,
      hoverinfo: "x+y",
      x: [lastTerm, nextTerm],
      y: [lastY, arimaForecast],
      text: ["", "ARIMA"],
      textposition: "top center",
      line: { width: 3, color: "#ff5733", dash: "dot" },
      marker: { size: [0, 14], color: "#ff5733", symbol: arimaMae === minMae ? "star" : "circle" },
      opacity: arimaMae === minMae ? 1 : 0.5,
      showlegend: arimaForecast !== null && !isNaN(arimaForecast)
    };

    // SARIMA forecast
    const sarimaForecast = predTarget ? predTarget.sarima_forecast : null;
    const sarimaMae = predTarget ? predTarget.sarima_mae : null;
    const traceSarima = {
      type: "scatter",
      mode: "lines+markers+text",
      name: `SARIMA Forecast (MAE: ${sarimaMae != null ? sarimaMae.toFixed(1) : "N/A"})`,
      hoverinfo: "x+y",
      x: [lastTerm, nextTerm],
      y: [lastY, sarimaForecast],
      text: ["", "SARIMA"],
      textposition: "bottom center",
      line: { width: 3, color: "#ffa500", dash: "dot" },
      marker: { size: [0, 14], color: "#ffa500", symbol: sarimaMae === minMae ? "star" : "circle" },
      opacity: sarimaMae === minMae ? 1 : 0.5,
      showlegend: sarimaForecast !== null && !isNaN(sarimaForecast)
    };

    // ARIMAX forecast
    const arimaxForecast = predTarget ? predTarget.arimax_forecast : null;
    const arimaxMae = predTarget ? predTarget.arimax_mae : null;
    const traceArimax = {
      type: "scatter",
      mode: "lines+markers+text",
      name: `ARIMAX Forecast (MAE: ${arimaxMae != null ? arimaxMae.toFixed(1) : "N/A"})`,
      hoverinfo: "x+y",
      x: [lastTerm, nextTerm],
      y: [lastY, arimaxForecast],
      text: ["", "ARIMAX"],
      textposition: "top center",
      line: { width: 3, color: "#8000ff", dash: "dot" },
      marker: { size: [0, 14], color: "#8000ff", symbol: (arimaxMae ?? 0) === minMae ? "star" : "circle" },
      opacity: arimaxMae === minMae ? 1 : 0.5,
      showlegend: arimaxForecast !== null && !isNaN(arimaxForecast)
    };

    // SARIMAX forecast
    const sarimaxForecast = predTarget ? predTarget.sarimax_forecast : null;
    const sarimaxMae = predTarget ? predTarget.sarimax_mae : null;
    const traceSarimax = {
      type: "scatter",
      mode: "lines+markers+text",
      name: `SARIMAX Forecast (MAE: ${sarimaxMae != null ? sarimaxMae.toFixed(1) : "N/A"})`,
      hoverinfo: "x+y",
      x: [lastTerm, nextTerm],
      y: [lastY, sarimaxForecast],
      text: ["", "SARIMAX"],
      textposition: "bottom center",
      line: { width: 3, color: "#00cc44", dash: "dot" },
      marker: { size: [0, 14], color: "#00cc44", symbol: (sarimaxMae ?? 0) === minMae ? "star" : "circle" },
      opacity: sarimaxMae === minMae ? 1 : 0.5,
      showlegend: sarimaxForecast !== null && !isNaN(sarimaxForecast)
    };

    // Actual Enrollment point (if available)
    let traceActual = null;
    if (predTarget && predTarget.actual_enrolled !== null && predTarget.actual_enrolled !== undefined) {
      traceActual = {
        type: "scatter",
        mode: "markers+text",
        name: `Actual Enrollment (${predTarget.actual_enrolled})`,
        hoverinfo: "x+y",
        x: [nextTerm],
        y: [predTarget.actual_enrolled],
        text: [`Actual: ${predTarget.actual_enrolled}`],
        textposition: "bottom right",
        marker: { size: 14, color: "#17a2b8", symbol: "diamond" },
        showlegend: true
      };
    }

    // Validation Trace
    let validationTrace = null;
    if (bestModel && predTarget) {
      const colorMap = {
        arima: "#ff5733",
        sarima: "#ffa500",
        arimax: "#8000ff",
        sarimax: "#00cc44"
      };

      const valTerms = predTarget[`${bestModel}_val_terms`];
      const valPreds = predTarget[`${bestModel}_val_preds`];

      if (valTerms && valPreds) {
        const termLabels = valTerms.map(term => {
          const year = Math.floor(term / 100);
          const sem = term % 100;
          const semNames = { 1: "Spring", 2: "Summer", 3: "Fall" };
          return `${semNames[sem] || "Unknown"} ${year}`;
        });

        validationTrace = {
          type: "scatter",
          mode: "markers+text",
          name: `Validation (${bestModel.toUpperCase()})`,
          hoverinfo: "x+y",
          x: termLabels,
          y: valPreds,
          textposition: "top center",
          marker: {
            size: 12,
            color: colorMap[bestModel],
            symbol: "x"
          }
        };
      }
    }

    const traces = [tracePast, traceArima, traceArimax];
    if (!isYearly) {
      traces.push(traceSarima, traceSarimax);
    }
    if (traceActual) {
      traces.push(traceActual);
    }
    if (validationTrace) {
      traces.push(validationTrace);
    }

    const layout = {
      title: { text: histData.title || selected },
      xaxis: { title: "Term", automargin: true, tickfont: { size: 12 } },
      yaxis: { 
        title: "Enrollment Count",
        range: [0, null],
        automargin: true,
        rangemode: "tozero"
      },
      margin: { t: 80, r: 80, b: 60, l: 80 },
      font: { size: 15 },
      plot_bgcolor: "#fafafa",
      paper_bgcolor: "#fafafa",
      legend: {
        x: 1.05,
        y: 1,
        bgcolor: "rgba(255,255,255,0)",
        bordercolor: "rgba(0,0,0,0)",
        title: { text: "   ℹ️ Click legend items to hide or show data<br>", font: { size: 12, color: "#777"}}
      }
    };

    const config = {
      responsive: true,
      displayModeBar: true,
      scrollZoom: true
    };

    Plotly.newPlot(chartDiv, traces, layout, config);
  }

  dropdown.addEventListener("change", renderChart);
  predictModeSelect.addEventListener("change", renderChart);

  dropdown.value = "CSCE A101";
  renderChart();
</script>
